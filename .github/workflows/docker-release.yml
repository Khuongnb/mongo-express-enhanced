# Builds the enhanced image for linux/amd64 and linux/arm64 and publishes it to Docker Hub.
#
#   push a tag  e-vX.Y.Z[-rcN]   -> build, then push to Docker Hub
#   push to e-master / releases/e-v*   -> build only (nothing is pushed), to catch a broken build before tagging
#
# A tag runs the workflow file as it is AT THE TAGGED COMMIT, so a release branch must contain this file.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME   the Docker Hub account that owns the repository
#   DOCKERHUB_TOKEN      an access token for it with Read & Write scope
name: docker-release

on:
  push:
    tags:
      - 'e-v*'
    branches:
      - e-master
      - 'releases/e-v*'
    paths-ignore:
      - '**.md'
      - docs/**

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: khuongnb/mongo-express-enhanced

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Work out tags
        id: meta
        run: |
          publish=false
          version="${GITHUB_SHA::7}"
          tags="${IMAGE}:ci-${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            publish=true
            version="${GITHUB_REF_NAME}"
            tags="${IMAGE}:${GITHUB_REF_NAME}"
            # a final release (e-vX.Y.Z, not a -rc) also moves X.Y.Z and latest
            if [[ "${GITHUB_REF_NAME}" =~ ^e-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              tags="${tags},${IMAGE}:${BASH_REMATCH[1]},${IMAGE}:latest"
            fi
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Tags: ${tags} (publish=${publish})"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build${{ steps.meta.outputs.publish == 'true' && ' and push' || '' }}
        uses: docker/bake-action@v6
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.meta.outputs.version }}
          REVISION: ${{ github.sha }}
        with:
          source: .
          push: ${{ steps.meta.outputs.publish == 'true' }}
          set: |
            upstream.cache-from=type=gha,scope=upstream
            upstream.cache-to=type=gha,scope=upstream,mode=max
            enhanced.cache-from=type=gha,scope=enhanced
            enhanced.cache-to=type=gha,scope=enhanced,mode=max
